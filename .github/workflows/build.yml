name: Build PrintTheShot Beta

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact: PrintTheShot-linux-x64
            script: scripts/build_linux.sh
          - os: macos-latest
            artifact: PrintTheShot-macos
            script: scripts/build_macos.sh
          - os: windows-latest
            artifact: PrintTheShot-windows-x64.exe
            script: scripts/build_windows.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            bash -lc "cd \$GITHUB_WORKSPACE && ./scripts/build_windows.bat"
          else
            bash -lc "cd \$GITHUB_WORKSPACE && chmod +x ${{ matrix.script }} && ./${{ matrix.script }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/PrintTheShot
            dist/PrintTheShot.exe
            dist/PrintTheShot.app
          if-no-files-found: ignore

      - name: Publish to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PrintTheShot
            dist/PrintTheShot.exe
            dist/PrintTheShot.app
